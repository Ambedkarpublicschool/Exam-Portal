<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exam Mark Entry Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white; color: black; }
      table { border-collapse: collapse; width: 100%; font-size: 10px; }
      th, td { border: 1px solid #000 !important; padding: 2px 3px !important; }
      input { border: none !important; background: transparent !important; }
    }
    /* Number arrows remove */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 text-[11px]">

  <header class="bg-indigo-700 text-white px-2 py-1.5 shadow-md no-print sticky top-0 z-50">
    <div class="w-full flex justify-between items-center gap-2">
      <h1 class="text-xs sm:text-sm font-bold flex items-center gap-1">
        <i class="fa-solid fa-graduation-cap"></i> APS Exam Portal
      </h1>
      
      <div class="flex items-center gap-1.5">
        <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2 py-0.5 rounded text-[10px] font-medium shadow flex items-center gap-1">
          <i class="fa-solid fa-print"></i> प्रिंट
        </button>
        <button onclick="handlePrintResult()" class="bg-amber-500 hover:bg-amber-600 text-white px-2 py-0.5 rounded text-[10px] font-medium shadow flex items-center gap-1">
          <i class="fa-solid fa-file-lines"></i> रिजल्ट (<span id="selectedCount">0</span>)
        </button>
      </div>
    </div>
  </header>

  <div class="w-full px-2 py-1.5 no-print">
    <div class="bg-white rounded shadow-sm p-1.5 grid grid-cols-5 gap-1.5 items-center">
      
      <div>
        <label class="block text-[9px] font-semibold text-gray-500 leading-tight">Session</label>
        <select id="filterSession" onchange="applyFilters()" class="w-full border border-gray-300 rounded px-1 py-0.5 text-[10px] focus:ring-0">
          <option value="">लोड...</option>
        </select>
      </div>

      <div>
        <label class="block text-[9px] font-semibold text-gray-500 leading-tight">Exam</label>
        <select id="filterExam" onchange="onExamChange()" class="w-full border border-gray-300 rounded px-1 py-0.5 text-[10px] focus:ring-0">
          <option value="">परीक्षा चुनें</option>
        </select>
      </div>

      <div>
        <label class="block text-[9px] font-semibold text-gray-500 leading-tight">Class</label>
        <select id="filterClass" onchange="applyFilters()" class="w-full border border-gray-300 rounded px-1 py-0.5 text-[10px] focus:ring-0">
          <option value="ALL">All</option>
        </select>
      </div>

      <div>
        <label class="block text-[9px] font-semibold text-gray-500 leading-tight">Sec</label>
        <select id="filterSection" onchange="applyFilters()" class="w-full border border-gray-300 rounded px-1 py-0.5 text-[10px] focus:ring-0">
          <option value="ALL">All</option>
        </select>
      </div>

      <div>
        <label class="block text-[9px] font-semibold text-gray-500 leading-tight">Search</label>
        <input type="text" id="filterSearch" oninput="applyFilters()" placeholder="खोजें..." class="w-full border border-gray-300 rounded px-1 py-0.5 text-[10px] focus:ring-0">
      </div>

    </div>
  </div>

  <main class="w-full px-1 pb-10">
    <div id="loadingStatus" class="text-center py-6 font-medium text-indigo-600 text-xs">
      <i class="fa-solid fa-spinner fa-spin text-lg mb-1"></i><br>लोड हो रहा है...
    </div>

    <div id="tableContainer" class="bg-white rounded shadow-sm overflow-hidden hidden w-full">
      <table class="w-full text-left border-collapse table-fixed">
        <thead class="bg-indigo-50 text-indigo-950 font-bold border-b border-indigo-200 select-none">
          <tr id="tableHeaderRow">
            </tr>
        </thead>
        <tbody id="studentTableBody" class="divide-y divide-gray-200">
          </tbody>
      </table>
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzk8DGFenhOJinh2zhfTxBvuxCcWUg1rclsor2aPlspIURPmX1ivsWSHQmPeBDDL_TJLg/exec";

    let state = {
      sessions: [],
      exams: [],
      students: [],
      savedMarks: {},
      currentSubjects: [],
      filteredStudents: [],
      sortCol: null,
      sortAsc: true
    };

    function formatDrivePhoto(url) {
      if (!url) return 'https://placehold.co/50x50?text=NA';
      let fileId = '';
      const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      const dMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      
      if (idMatch && idMatch[1]) fileId = idMatch[1];
      else if (dMatch && dMatch[1]) fileId = dMatch[1];

      return fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w60` : url;
    }

    async function init() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        
        state.sessions = data.sessions || [];
        state.exams = data.exams || [];
        state.students = data.students || [];
        
        state.savedMarks = {};
        (data.savedMarks || []).forEach(item => {
          const key = `${item.session}_${item.studentId}_${item.examName}`;
          state.savedMarks[key] = item.marks || {};
        });

        populateDropdowns();
        document.getElementById('loadingStatus').classList.add('hidden');
        document.getElementById('tableContainer').classList.remove('hidden');
        onExamChange();
      } catch (err) {
        document.getElementById('loadingStatus').innerHTML = `<span class="text-red-500 font-bold">डेटा लोड एरर: ${err.message}</span>`;
      }
    }

    function populateDropdowns() {
      const sessionSelect = document.getElementById('filterSession');
      sessionSelect.innerHTML = '';
      state.sessions.forEach((s, idx) => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        if (idx === state.sessions.length - 1) opt.selected = true;
        sessionSelect.appendChild(opt);
      });

      const examSelect = document.getElementById('filterExam');
      examSelect.innerHTML = '';
      state.exams.forEach((ex, idx) => {
        const opt = document.createElement('option');
        opt.value = ex.examName;
        opt.textContent = ex.examName;
        if (idx === 0) opt.selected = true;
        examSelect.appendChild(opt);
      });

      const classes = Array.from(new Set(state.students.map(s => s.className).filter(Boolean)));
      const classSelect = document.getElementById('filterClass');
      classSelect.innerHTML = '<option value="ALL">All</option>';
      classes.forEach(c => classSelect.innerHTML += `<option value="${c}">${c}</option>`);

      const sections = Array.from(new Set(state.students.map(s => s.section).filter(Boolean)));
      const secSelect = document.getElementById('filterSection');
      secSelect.innerHTML = '<option value="ALL">All</option>';
      sections.forEach(sec => secSelect.innerHTML += `<option value="${sec}">${sec}</option>`);
    }

    function onExamChange() {
      const selectedExam = document.getElementById('filterExam').value;
      const found = state.exams.find(e => e.examName === selectedExam);
      state.currentSubjects = found ? found.subjects : [];
      renderHeaders();
      applyFilters();
    }

    function renderHeaders() {
      const tr = document.getElementById('tableHeaderRow');
      tr.innerHTML = `
        <th class="p-1 text-center w-7 border-r border-indigo-100">
          <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)" class="cursor-pointer scale-90">
        </th>
        <th class="p-1 text-center w-6 cursor-pointer border-r border-indigo-100" onclick="sortTable('sr')">#</th>
        <th class="p-1 text-left w-28 sm:w-36 cursor-pointer border-r border-indigo-100" onclick="sortTable('studentName')">छात्र विवरण</th>
        <th class="p-1 text-center w-10 cursor-pointer border-r border-indigo-100" onclick="sortTable('className')">कक्षा</th>
      `;
      
      state.currentSubjects.forEach(sub => {
        const th = document.createElement('th');
        th.className = "p-0.5 text-center text-[10px] font-bold border-r border-indigo-100 last:border-r-0";
        th.textContent = sub;
        tr.appendChild(th);
      });
    }

    function applyFilters() {
      const session = document.getElementById('filterSession').value;
      const cls = document.getElementById('filterClass').value;
      const sec = document.getElementById('filterSection').value;
      const q = document.getElementById('filterSearch').value.toLowerCase().trim();

      state.filteredStudents = state.students.filter(s => {
        const matchSession = !session || s.session === session;
        const matchClass = cls === 'ALL' || s.className === cls;
        const matchSec = sec === 'ALL' || s.section === sec;
        const matchSearch = !q || s.studentName.toLowerCase().includes(q) || s.studentId.toLowerCase().includes(q) || s.fatherName.toLowerCase().includes(q);
        return matchSession && matchClass && matchSec && matchSearch;
      });

      renderTableRows();
    }

    function renderTableRows() {
      const tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = '';
      
      const currentSession = document.getElementById('filterSession').value;
      const currentExam = document.getElementById('filterExam').value;

      state.filteredStudents.forEach((stu, idx) => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-indigo-50/40 transition border-b border-gray-100";
        
        const compositeKey = `${currentSession}_${stu.studentId}_${currentExam}`;
        const studentSavedMarks = state.savedMarks[compositeKey] || {};

        let rowHtml = `
          <td class="p-0.5 text-center border-r border-gray-100">
            <input type="checkbox" class="student-check cursor-pointer scale-90" value="${stu.studentId}" onchange="updateSelectedCount()">
          </td>
          
          <td class="p-0.5 text-center text-gray-400 font-mono text-[9px] border-r border-gray-100">${idx + 1}</td>
          
          <td class="p-1 border-r border-gray-100 overflow-hidden">
            <div class="flex items-center gap-1">
              <img src="${formatDrivePhoto(stu.photoLink)}" 
                   referrerpolicy="no-referrer" 
                   loading="lazy"
                   class="w-6 h-6 rounded-full object-cover shrink-0 border border-gray-200" 
                   onerror="this.onerror=null;this.src='https://placehold.co/50x50?text=NA';">
              <div class="truncate leading-none">
                <div class="font-bold text-gray-900 truncate text-[11px]">${stu.studentName}</div>
                <div class="text-[9px] text-gray-500 truncate mt-0.5">${stu.fatherName || stu.studentId}</div>
              </div>
            </div>
          </td>
          
          <td class="p-0.5 text-center font-semibold text-gray-700 text-[10px] border-r border-gray-100 leading-tight">
            ${stu.className}<span class="text-[9px] text-gray-400 block">${stu.section}</span>
          </td>
        `;

        // Subjects Compact Input Box
        state.currentSubjects.forEach(sub => {
          const val = studentSavedMarks[sub] !== undefined ? studentSavedMarks[sub] : '';
          rowHtml += `
            <td class="p-0.5 text-center border-r border-gray-100 last:border-r-0">
              <input type="text" 
                     data-session="${currentSession}" 
                     data-id="${stu.studentId}" 
                     data-exam="${currentExam}" 
                     data-class="${stu.className}"
                     data-sec="${stu.section}"
                     data-sub="${sub}"
                     value="${val}" 
                     onblur="saveSingleMark(this)" 
                     class="w-full max-w-[34px] h-6 border border-gray-300 rounded text-center text-[11px] font-medium focus:bg-indigo-50 focus:border-indigo-600 outline-none p-0">
            </td>
          `;
        });

        tr.innerHTML = rowHtml;
        tbody.appendChild(tr);
      });

      updateSelectedCount();
    }

    async function saveSingleMark(input) {
      const session = input.dataset.session;
      const studentId = input.dataset.id;
      const examName = input.dataset.exam;
      const className = input.dataset.class;
      const section = input.dataset.sec;
      const subject = input.dataset.sub;
      const value = input.value.trim();

      const key = `${session}_${studentId}_${examName}`;
      if (!state.savedMarks[key]) state.savedMarks[key] = {};
      
      if (state.savedMarks[key][subject] === value) return;

      input.classList.remove('border-gray-300', 'border-emerald-500', 'border-red-500');
      input.classList.add('border-amber-400', 'bg-amber-50');

      const payload = {
        session: session,
        studentId: studentId,
        examName: examName,
        className: className,
        section: section,
        marks: { [subject]: value }
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        state.savedMarks[key][subject] = value;
        input.classList.remove('border-amber-400', 'bg-amber-50');
        input.classList.add('border-emerald-500', 'bg-emerald-50/40');
        setTimeout(() => {
          input.classList.remove('bg-emerald-50/40');
          input.classList.add('border-gray-300');
        }, 1500);
      } catch (err) {
        input.classList.remove('border-amber-400', 'bg-amber-50');
        input.classList.add('border-red-500', 'bg-red-50');
      }
    }

    function toggleSelectAll(isChecked) {
      document.querySelectorAll('.student-check').forEach(cb => cb.checked = isChecked);
      updateSelectedCount();
    }

    function updateSelectedCount() {
      const count = document.querySelectorAll('.student-check:checked').length;
      document.getElementById('selectedCount').textContent = count;
    }

    function sortTable(key) {
      if (state.sortCol === key) {
        state.sortAsc = !state.sortAsc;
      } else {
        state.sortCol = key;
        state.sortAsc = true;
      }

      state.filteredStudents.sort((a, b) => {
        let valA = a[key] || '';
        let valB = b[key] || '';
        return state.sortAsc ? valA.localeCompare(valB, 'hi') : valB.localeCompare(valA, 'hi');
      });

      renderTableRows();
    }

    function handlePrintResult() {
      const selectedIds = Array.from(document.querySelectorAll('.student-check:checked')).map(cb => cb.value);
      if (selectedIds.length === 0) {
        alert('कृपया कम से कम एक छात्र को चुनें!');
        return;
      }
      alert(`चुने गए ${selectedIds.length} छात्रों के रिजल्ट प्रिंट करने का मॉड्यूल तैयार किया जाएगा।`);
    }

    window.onload = init;
  </script>
</body>
</html>
