<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>APS Exam Portal - Mark Entry</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* -------------------------------------------------------------
       1. FREEZE HEADER WITH SOLID OPAQUE BACKGROUND
    ------------------------------------------------------------- */
    .table-scroll-container {
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      position: relative;
      background-color: #ffffff;
    }
    
    /* Ensure Header has 100% solid non-transparent background */
    thead {
      position: sticky;
      top: 0;
      z-index: 30;
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 30;
      background-color: #e0e7ff !important; /* Solid Indigo-100 */
      box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.15);
      opacity: 1 !important;
    }

    /* -------------------------------------------------------------
       2. MOBILE SPECIFIC CSS (Screens up to 768px - Landscape/Portrait)
    ------------------------------------------------------------- */
    @media (max-width: 768px) {
      .pc-only { display: none !important; }
      .mobile-only { display: table-cell !important; }
      
      .table-scroll-container {
        max-height: calc(100vh - 100px);
      }

      table {
        table-layout: fixed;
        width: 100%;
      }
      th, td {
        padding: 2px 1px !important;
        font-size: 10px !important;
      }
      .subject-input {
        width: 100% !important;
        max-width: 32px !important;
        height: 24px !important;
        font-size: 11px !important;
        padding: 0 !important;
        text-align: center;
      }
    }

    /* -------------------------------------------------------------
       3. PC / DESKTOP SPECIFIC CSS (Screens 769px and above)
    ------------------------------------------------------------- */
    @media (min-width: 769px) {
      .mobile-only { display: none !important; }
      .pc-only { display: table-cell !important; }

      .table-scroll-container {
        max-height: calc(100vh - 150px);
      }

      table {
        table-layout: auto;
        width: 100%;
      }
      th, td {
        padding: 6px 8px !important;
        font-size: 13px !important;
      }
      .subject-input {
        width: 52px !important;
        height: 32px !important;
        font-size: 13px !important;
        text-align: center;
        border-radius: 4px;
      }
    }

    /* -------------------------------------------------------------
       4. PRINT STYLING
    ------------------------------------------------------------- */
    @media print {
      .no-print { display: none !important; }
      .table-scroll-container { max-height: none !important; overflow: visible !important; }
      thead th { position: static !important; background-color: #f3f4f6 !important; }
      body { background: white; color: black; }
      table { border-collapse: collapse; width: 100%; font-size: 11px; }
      th, td { border: 1px solid #000 !important; padding: 4px 6px !important; }
      input { border: none !important; background: transparent !important; }
    }

    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Top Sticky Header -->
  <header class="bg-indigo-700 text-white px-3 py-2 shadow-md no-print sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center gap-2">
      <h1 class="text-xs sm:text-base md:text-lg font-bold flex items-center gap-1.5">
        <i class="fa-solid fa-graduation-cap"></i> APS Exam Portal
      </h1>
      
      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded text-xs font-medium shadow flex items-center gap-1">
          <i class="fa-solid fa-print"></i> प्रिंट
        </button>
        <button onclick="handlePrintResult()" class="bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1 rounded text-xs font-medium shadow flex items-center gap-1">
          <i class="fa-solid fa-file-lines"></i> रिजल्ट (<span id="selectedCount">0</span>)
        </button>
      </div>
    </div>
  </header>

  <!-- Filter Bar -->
  <div class="max-w-7xl mx-auto px-2 py-2 no-print">
    <div class="bg-white rounded-lg shadow-sm p-2 grid grid-cols-5 gap-1.5 sm:gap-3 items-center">
      
      <!-- Session Filter -->
      <div>
        <label class="block text-[10px] sm:text-xs font-semibold text-gray-600 leading-tight mb-0.5">Session</label>
        <select id="filterSession" onchange="applyFilters()" class="w-full border border-gray-300 rounded px-1.5 py-1 text-[11px] sm:text-xs focus:ring-1 focus:ring-indigo-500 bg-white">
          <option value="">लोड...</option>
        </select>
      </div>

      <!-- Exam Name Filter -->
      <div>
        <label class="block text-[10px] sm:text-xs font-semibold text-gray-600 leading-tight mb-0.5">Exam</label>
        <select id="filterExam" onchange="onExamChange()" class="w-full border border-gray-300 rounded px-1.5 py-1 text-[11px] sm:text-xs focus:ring-1 focus:ring-indigo-500 bg-white">
          <option value="">परीक्षा चुनें</option>
        </select>
      </div>

      <!-- Class Filter -->
      <div>
        <label class="block text-[10px] sm:text-xs font-semibold text-gray-600 leading-tight mb-0.5">Class</label>
        <select id="filterClass" onchange="applyFilters()" class="w-full border border-gray-300 rounded px-1.5 py-1 text-[11px] sm:text-xs focus:ring-1 focus:ring-indigo-500 bg-white">
          <option value="ALL">All</option>
        </select>
      </div>

      <!-- Section Filter -->
      <div>
        <label class="block text-[10px] sm:text-xs font-semibold text-gray-600 leading-tight mb-0.5">Sec</label>
        <select id="filterSection" onchange="applyFilters()" class="w-full border border-gray-300 rounded px-1.5 py-1 text-[11px] sm:text-xs focus:ring-1 focus:ring-indigo-500 bg-white">
          <option value="ALL">All</option>
        </select>
      </div>

      <!-- Search Box -->
      <div>
        <label class="block text-[10px] sm:text-xs font-semibold text-gray-600 leading-tight mb-0.5">Search</label>
        <input type="text" id="filterSearch" oninput="applyFilters()" placeholder="खोजें..." class="w-full border border-gray-300 rounded px-1.5 py-1 text-[11px] sm:text-xs focus:ring-1 focus:ring-indigo-500 bg-white">
      </div>

    </div>
  </div>

  <!-- Table Container with Solid Frozen Header Scroll -->
  <main class="max-w-7xl mx-auto px-1 sm:px-2 pb-6">
    <div id="loadingStatus" class="text-center py-8 font-medium text-indigo-600 text-xs sm:text-sm">
      <i class="fa-solid fa-spinner fa-spin text-xl mb-1.5"></i><br>लोड हो रहा है, प्रतीक्षा करें...
    </div>

    <div id="tableContainer" class="bg-white rounded-lg shadow-sm border border-gray-200 hidden">
      <div class="table-scroll-container">
        <table class="border-collapse w-full">
          <thead class="text-indigo-950 font-bold border-b border-indigo-200 select-none">
            <tr id="tableHeaderRow">
              <!-- Dynamic Headers -->
            </tr>
          </thead>
          <tbody id="studentTableBody" class="divide-y divide-gray-200 bg-white">
            <!-- Dynamic Rows -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzk8DGFenhOJinh2zhfTxBvuxCcWUg1rclsor2aPlspIURPmX1ivsWSHQmPeBDDL_TJLg/exec";

    let state = {
      sessions: [],
      exams: [],
      students: [],
      savedMarks: {},
      currentSubjects: [],
      filteredStudents: [],
      sortCol: null,
      sortAsc: true
    };

    function formatDrivePhoto(url) {
      if (!url) return 'https://placehold.co/60x60?text=NA';
      let fileId = '';
      const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      const dMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      
      if (idMatch && idMatch[1]) fileId = idMatch[1];
      else if (dMatch && dMatch[1]) fileId = dMatch[1];

      return fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w80` : url;
    }

    async function init() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        
        state.sessions = data.sessions || [];
        state.exams = data.exams || [];
        state.students = data.students || [];
        
        state.savedMarks = {};
        (data.savedMarks || []).forEach(item => {
          const key = `${item.session}_${item.studentId}_${item.examName}`;
          state.savedMarks[key] = item.marks || {};
        });

        populateDropdowns();
        document.getElementById('loadingStatus').classList.add('hidden');
        document.getElementById('tableContainer').classList.remove('hidden');
        onExamChange();
      } catch (err) {
        document.getElementById('loadingStatus').innerHTML = `<span class="text-red-500 font-bold">डेटा लोड एरर: ${err.message}</span>`;
      }
    }

    function populateDropdowns() {
      const sessionSelect = document.getElementById('filterSession');
      sessionSelect.innerHTML = '';
      state.sessions.forEach((s, idx) => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        if (idx === state.sessions.length - 1) opt.selected = true;
        sessionSelect.appendChild(opt);
      });

      const examSelect = document.getElementById('filterExam');
      examSelect.innerHTML = '';
      state.exams.forEach((ex, idx) => {
        const opt = document.createElement('option');
        opt.value = ex.examName;
        opt.textContent = ex.examName;
        if (idx === 0) opt.selected = true;
        examSelect.appendChild(opt);
      });

      const classes = Array.from(new Set(state.students.map(s => s.className).filter(Boolean)));
      const classSelect = document.getElementById('filterClass');
      classSelect.innerHTML = '<option value="ALL">All</option>';
      classes.forEach(c => classSelect.innerHTML += `<option value="${c}">${c}</option>`);

      const sections = Array.from(new Set(state.students.map(s => s.section).filter(Boolean)));
      const secSelect = document.getElementById('filterSection');
      secSelect.innerHTML = '<option value="ALL">All</option>';
      sections.forEach(sec => secSelect.innerHTML += `<option value="${sec}">${sec}</option>`);
    }

    function onExamChange() {
      const selectedExam = document.getElementById('filterExam').value;
      const found = state.exams.find(e => e.examName === selectedExam);
      state.currentSubjects = found ? found.subjects : [];
      renderHeaders();
      applyFilters();
    }

    function renderHeaders() {
      const tr = document.getElementById('tableHeaderRow');
      tr.innerHTML = `
        <th class="p-1 text-center w-7 sm:w-10 border-r border-indigo-200">
          <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)" class="cursor-pointer scale-90 sm:scale-100">
        </th>
        <th class="p-1 text-center w-6 sm:w-12 cursor-pointer border-r border-indigo-200" onclick="sortTable('sr')">#</th>
        
        <!-- PC Headers -->
        <th class="pc-only p-2 cursor-pointer border-r border-indigo-200" onclick="sortTable('studentId')">ID</th>
        <th class="pc-only p-2 text-center border-r border-indigo-200">Photo</th>
        <th class="pc-only p-2 cursor-pointer border-r border-indigo-200" onclick="sortTable('studentName')">छात्र का नाम</th>
        <th class="pc-only p-2 cursor-pointer border-r border-indigo-200" onclick="sortTable('fatherName')">पिता का नाम</th>
        <th class="pc-only p-2 text-center cursor-pointer border-r border-indigo-200" onclick="sortTable('className')">Class</th>
        <th class="pc-only p-2 text-center cursor-pointer border-r border-indigo-200" onclick="sortTable('section')">Sec</th>

        <!-- Mobile Single Header -->
        <th class="mobile-only p-1 text-left w-28 sm:w-36 cursor-pointer border-r border-indigo-200" onclick="sortTable('studentName')">छात्र विवरण</th>
        <th class="mobile-only p-1 text-center w-10 cursor-pointer border-r border-indigo-200" onclick="sortTable('className')">कक्षा</th>
      `;
      
      state.currentSubjects.forEach(sub => {
        const th = document.createElement('th');
        th.className = "p-1 text-center font-bold border-r border-indigo-200 last:border-r-0";
        th.textContent = sub;
        tr.appendChild(th);
      });
    }

    function applyFilters() {
      const session = document.getElementById('filterSession').value;
      const cls = document.getElementById('filterClass').value;
      const sec = document.getElementById('filterSection').value;
      const q = document.getElementById('filterSearch').value.toLowerCase().trim();

      state.filteredStudents = state.students.filter(s => {
        const matchSession = !session || s.session === session;
        const matchClass = cls === 'ALL' || s.className === cls;
        const matchSec = sec === 'ALL' || s.section === sec;
        const matchSearch = !q || s.studentName.toLowerCase().includes(q) || s.studentId.toLowerCase().includes(q) || s.fatherName.toLowerCase().includes(q);
        return matchSession && matchClass && matchSec && matchSearch;
      });

      renderTableRows();
    }

    function renderTableRows() {
      const tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = '';
      
      const currentSession = document.getElementById('filterSession').value;
      const currentExam = document.getElementById('filterExam').value;

      state.filteredStudents.forEach((stu, idx) => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-indigo-50/40 transition border-b border-gray-200 bg-white";
        
        const compositeKey = `${currentSession}_${stu.studentId}_${currentExam}`;
        const studentSavedMarks = state.savedMarks[compositeKey] || {};

        let rowHtml = `
          <!-- Common: Checkbox & SR -->
          <td class="p-1 text-center border-r border-gray-200">
            <input type="checkbox" class="student-check cursor-pointer scale-90 sm:scale-100" value="${stu.studentId}" onchange="updateSelectedCount()">
          </td>
          <td class="p-1 text-center text-gray-500 font-mono text-[10px] sm:text-xs border-r border-gray-200">${idx + 1}</td>
          
          <!-- PC Specific Columns -->
          <td class="pc-only p-2 font-mono font-medium border-r border-gray-200">${stu.studentId}</td>
          <td class="pc-only p-1.5 text-center border-r border-gray-200">
            <img src="${formatDrivePhoto(stu.photoLink)}" referrerpolicy="no-referrer" class="w-8 h-8 rounded-full object-cover mx-auto border" onerror="this.onerror=null;this.src='https://placehold.co/60x60?text=NA';">
          </td>
          <td class="pc-only p-2 font-semibold text-gray-900 border-r border-gray-200">${stu.studentName}</td>
          <td class="pc-only p-2 text-gray-600 border-r border-gray-200">${stu.fatherName}</td>
          <td class="pc-only p-2 text-center border-r border-gray-200">${stu.className}</td>
          <td class="pc-only p-2 text-center border-r border-gray-200">${stu.section}</td>

          <!-- Mobile Specific Columns -->
          <td class="mobile-only p-1 border-r border-gray-200 overflow-hidden">
            <div class="flex items-center gap-1">
              <img src="${formatDrivePhoto(stu.photoLink)}" referrerpolicy="no-referrer" class="w-6 h-6 rounded-full object-cover shrink-0 border" onerror="this.onerror=null;this.src='https://placehold.co/60x60?text=NA';">
              <div class="truncate leading-none">
                <div class="font-bold text-gray-900 truncate text-[11px]">${stu.studentName}</div>
                <div class="text-[9px] text-gray-500 truncate mt-0.5">${stu.fatherName || stu.studentId}</div>
              </div>
            </div>
          </td>
          <td class="mobile-only p-0.5 text-center font-semibold text-gray-700 text-[10px] border-r border-gray-200 leading-tight">
            ${stu.className}<span class="text-[9px] text-gray-400 block">${stu.section}</span>
          </td>
        `;

        // Subject Inputs
        state.currentSubjects.forEach(sub => {
          const val = studentSavedMarks[sub] !== undefined ? studentSavedMarks[sub] : '';
          rowHtml += `
            <td class="p-1 text-center border-r border-gray-200 last:border-r-0">
              <input type="text" 
                     data-session="${currentSession}" 
                     data-id="${stu.studentId}" 
                     data-exam="${currentExam}" 
                     data-class="${stu.className}"
                     data-sec="${stu.section}"
                     data-sub="${sub}"
                     value="${val}" 
                     onblur="saveSingleMark(this)" 
                     class="subject-input border border-gray-300 rounded font-medium focus:bg-indigo-50 focus:border-indigo-600 outline-none transition">
            </td>
          `;
        });

        tr.innerHTML = rowHtml;
        tbody.appendChild(tr);
      });

      updateSelectedCount();
    }

    async function saveSingleMark(input) {
      const session = input.dataset.session;
      const studentId = input.dataset.id;
      const examName = input.dataset.exam;
      const className = input.dataset.class;
      const section = input.dataset.sec;
      const subject = input.dataset.sub;
      const value = input.value.trim();

      const key = `${session}_${studentId}_${examName}`;
      if (!state.savedMarks[key]) state.savedMarks[key] = {};
      
      if (state.savedMarks[key][subject] === value) return;

      input.classList.remove('border-gray-300', 'border-emerald-500', 'border-red-500');
      input.classList.add('border-amber-400', 'bg-amber-50');

      const payload = {
        session: session,
        studentId: studentId,
        examName: examName,
        className: className,
        section: section,
        marks: { [subject]: value }
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        state.savedMarks[key][subject] = value;
        input.classList.remove('border-amber-400', 'bg-amber-50');
        input.classList.add('border-emerald-500', 'bg-emerald-50/50');
        setTimeout(() => {
          input.classList.remove('bg-emerald-50/50');
          input.classList.add('border-gray-300');
        }, 1500);
      } catch (err) {
        input.classList.remove('border-amber-400', 'bg-amber-50');
        input.classList.add('border-red-500', 'bg-red-50');
      }
    }

    function toggleSelectAll(isChecked) {
      document.querySelectorAll('.student-check').forEach(cb => cb.checked = isChecked);
      updateSelectedCount();
    }

    function updateSelectedCount() {
      const count = document.querySelectorAll('.student-check:checked').length;
      document.getElementById('selectedCount').textContent = count;
    }

    function sortTable(key) {
      if (state.sortCol === key) {
        state.sortAsc = !state.sortAsc;
      } else {
        state.sortCol = key;
        state.sortAsc = true;
      }

      state.filteredStudents.sort((a, b) => {
        let valA = a[key] || '';
        let valB = b[key] || '';
        return state.sortAsc ? valA.localeCompare(valB, 'hi') : valB.localeCompare(valA, 'hi');
      });

      renderTableRows();
    }

    function handlePrintResult() {
      const selectedIds = Array.from(document.querySelectorAll('.student-check:checked')).map(cb => cb.value);
      if (selectedIds.length === 0) {
        alert('कृपया कम से कम एक छात्र को चुनें!');
        return;
      }
      alert(`चुने गए ${selectedIds.length} छात्रों के रिजल्ट प्रिंट करने का मॉड्यूल तैयार किया जाएगा।`);
    }

    window.onload = init;
  </script>
</body>
</html>
