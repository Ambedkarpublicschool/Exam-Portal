<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>APS Exam Portal & Result Generator</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    /* -------------------------------------------------------------
       1. FREEZE HEADER WITH SOLID OPAQUE BACKGROUND (PORTAL DASHBOARD)
    ------------------------------------------------------------- */
    .table-scroll-container {
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      position: relative;
      background-color: #ffffff;
    }
    
    thead {
      position: sticky;
      top: 0;
      z-index: 30;
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 30;
      background-color: #e0e7ff !important;
      box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.15);
      opacity: 1 !important;
    }

    @media (max-width: 768px) {
      .pc-only { display: none !important; }
      .mobile-only { display: table-cell !important; }
      .table-scroll-container { max-height: calc(100vh - 100px); }
      table { table-layout: fixed; width: 100%; }
      th, td { padding: 2px 1px !important; font-size: 10px !important; }
      .subject-input { width: 100% !important; max-width: 32px !important; height: 24px !important; font-size: 11px !important; padding: 0 !important; text-align: center; }
    }

    @media (min-width: 769px) {
      .mobile-only { display: none !important; }
      .pc-only { display: table-cell !important; }
      .table-scroll-container { max-height: calc(100vh - 150px); }
      table { table-layout: auto; width: 100%; }
      th, td { padding: 6px 8px !important; font-size: 13px !important; }
      .subject-input { width: 52px !important; height: 32px !important; font-size: 13px !important; text-align: center; border-radius: 4px; }
    }

    /* -------------------------------------------------------------
       2. EXACT UI & PRINT 1:1 IDENTICAL LAYOUT
    ------------------------------------------------------------- */
    @page {
      size: A4 portrait;
      margin: 0;
    }
    
    .report-card-container {
      width: 196mm;
      height: 278mm;
      max-height: 278mm;
      margin: 0 auto 12mm auto;
      background-color: #ffffff;
      border: 2px solid #0f172a;
      padding: 7mm 8mm;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .report-table-box {
      width: 100%;
      border-collapse: collapse;
    }
    .report-table-box th, .report-table-box td {
      border: 1.5px solid #0f172a;
      box-sizing: border-box;
    }

    @media print {
      html, body {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      #portalSection {
        display: none !important;
      }
      #resultModalSection {
        display: block !important;
        position: static !important;
        background: transparent !important;
        padding: 9mm 0 0 0 !important;
        margin: 0 !important;
      }
      .report-card-container {
        width: 196mm !important;
        height: 278mm !important;
        max-height: 278mm !important;
        margin: 0 auto !important;
        padding: 7mm 8mm !important;
        box-sizing: border-box !important;
        page-break-after: always !important;
        break-after: page !important;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }

    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- ============================================================
       SECTION 1: MARK ENTRY PORTAL (Main Dashboard)
  ============================================================ -->
  <div id="portalSection">
    
    <!-- Top Sticky Header -->
    <header class="bg-indigo-700 text-white px-3 py-2 shadow-md no-print sticky top-0 z-50">
      <div class="max-w-7xl mx-auto flex justify-between items-center gap-2">
        <h1 class="text-xs sm:text-base md:text-lg font-bold flex items-center gap-1.5">
          <i class="fa-solid fa-graduation-cap"></i> APS Exam Portal
        </h1>
        
        <!-- Action Buttons -->
        <div class="flex items-center gap-2">
          <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded text-xs font-medium shadow flex items-center gap-1">
            <i class="fa-solid fa-print"></i> प्रिंट
          </button>
          <button onclick="handlePrintResult()" class="bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1 rounded text-xs font-medium shadow flex items-center gap-1">
            <i class="fa-solid fa-file-lines"></i> रिजल्ट (<span id="selectedCount">0</span>)
          </button>
        </div>
      </div>
    </header>

    <!-- Filter Bar -->
    <div class="max-w-7xl mx-auto px-2 py-2 no-print">
      <div class="bg-white rounded-lg shadow-sm p-2 grid grid-cols-5 gap-1.5 sm:gap-3 items-center">
        
        <!-- Session Filter -->
        <div>
          <label class="block text-[10px] sm:text-xs font-semibold text-gray-600 leading-tight mb-0.5">Session</label>
          <select id="filterSession" onchange="applyFilters()" class="w-full border border-gray-300 rounded px-1.5 py-1 text-[11px] sm:text-xs focus:ring-1 focus:ring-indigo-500 bg-white">
            <option value="">लोड...</option>
          </select>
        </div>

        <!-- Exam Name Filter -->
        <div>
          <label class="block text-[10px] sm:text-xs font-semibold text-gray-600 leading-tight mb-0.5">Exam</label>
          <select id="filterExam" onchange="onExamChange()" class="w-full border border-gray-300 rounded px-1.5 py-1 text-[11px] sm:text-xs focus:ring-1 focus:ring-indigo-500 bg-white">
            <option value="">परीक्षा चुनें</option>
          </select>
        </div>

        <!-- Class Filter -->
        <div>
          <label class="block text-[10px] sm:text-xs font-semibold text-gray-600 leading-tight mb-0.5">Class</label>
          <select id="filterClass" onchange="applyFilters()" class="w-full border border-gray-300 rounded px-1.5 py-1 text-[11px] sm:text-xs focus:ring-1 focus:ring-indigo-500 bg-white">
            <option value="ALL">All</option>
          </select>
        </div>

        <!-- Section Filter -->
        <div>
          <label class="block text-[10px] sm:text-xs font-semibold text-gray-600 leading-tight mb-0.5">Sec</label>
          <select id="filterSection" onchange="applyFilters()" class="w-full border border-gray-300 rounded px-1.5 py-1 text-[11px] sm:text-xs focus:ring-1 focus:ring-indigo-500 bg-white">
            <option value="ALL">All</option>
          </select>
        </div>

        <!-- Search Box -->
        <div>
          <label class="block text-[10px] sm:text-xs font-semibold text-gray-600 leading-tight mb-0.5">Search</label>
          <input type="text" id="filterSearch" oninput="applyFilters()" placeholder="खोजें..." class="w-full border border-gray-300 rounded px-1.5 py-1 text-[11px] sm:text-xs focus:ring-1 focus:ring-indigo-500 bg-white">
        </div>

      </div>
    </div>

    <!-- Table Container with Solid Frozen Header Scroll -->
    <main class="max-w-7xl mx-auto px-1 sm:px-2 pb-6">
      <div id="loadingStatus" class="text-center py-8 font-medium text-indigo-600 text-xs sm:text-sm">
        <i class="fa-solid fa-spinner fa-spin text-xl mb-1.5"></i><br>लोड हो रहा है, प्रतीक्षा करें...
      </div>

      <div id="tableContainer" class="bg-white rounded-lg shadow-sm border border-gray-200 hidden">
        <div class="table-scroll-container">
          <table class="border-collapse w-full">
            <thead class="text-indigo-950 font-bold border-b border-indigo-200 select-none">
              <tr id="tableHeaderRow">
                <!-- Dynamic Headers -->
              </tr>
            </thead>
            <tbody id="studentTableBody" class="divide-y divide-gray-200 bg-white">
              <!-- Dynamic Rows -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

  </div>


  <!-- ============================================================
       SECTION 2: REPORT CARD PREVIEW & BULK PRINT MODAL
  ============================================================ -->
  <div id="resultModalSection" class="hidden fixed inset-0 z-50 bg-gray-900/80 overflow-y-auto p-2 sm:p-4">
    
    <!-- Top Action Bar -->
    <div class="max-w-4xl mx-auto mb-4 bg-white p-3 rounded-lg shadow flex justify-between items-center no-print border border-gray-200">
      <div>
        <span class="font-bold text-sm text-indigo-950 flex items-center gap-1.5">
          <i class="fa-solid fa-file-invoice text-indigo-600"></i> APS Madhopur - Result Preview
        </span>
        <p class="text-xs text-gray-500">कुल चयनित छात्र: <span id="totalStudentsCount" class="font-bold text-indigo-600">0</span></p>
      </div>
      <div class="flex gap-2">
        <button onclick="closeResultView()" class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded font-medium text-xs transition">
          <i class="fa-solid fa-arrow-left"></i> पोर्टल पर लौटें
        </button>
        <button onclick="window.print()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded font-medium text-xs shadow flex items-center gap-1.5 transition">
          <i class="fa-solid fa-print"></i> सभी प्रिंट करें (A4)
        </button>
      </div>
    </div>

    <!-- Cards Container -->
    <div id="cardsContainer"></div>

  </div>


  <!-- ============================================================
       SECTION 3: JAVASCRIPT LOGIC
  ============================================================ -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzk8DGFenhOJinh2zhfTxBvuxCcWUg1rclsor2aPlspIURPmX1ivsWSHQmPeBDDL_TJLg/exec";
    const LOGO_URL = "https://i.postimg.cc/pLt1F2cD/logo-copy.png";

    const SUBJECT_MAP = {
      'H': 'HINDI',
      'E': 'ENGLISH',
      'M': 'MATHEMATICS',
      'S': 'SCIENCE',
      'Sst': 'SOCIAL SCIENCE',
      'D': 'DRAWING',
      'GK&M': 'GK & MORAL SCIENCE',
      'C': 'COMPUTER'
    };

    function getSubjectFullName(code) {
      return SUBJECT_MAP[code] || code;
    }

    let state = {
      sessions: [],
      exams: [],
      students: [],
      savedMarks: {},
      rawMarksList: [],
      currentSubjects: [],
      filteredStudents: [],
      sortCol: null,
      sortAsc: true
    };

    function formatDrivePhoto(url) {
      if (!url) return 'https://placehold.co/100x120?text=Passport+Photo';
      let fileId = '';
      const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      const dMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (idMatch && idMatch[1]) fileId = idMatch[1];
      else if (dMatch && dMatch[1]) fileId = dMatch[1];
      return fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w200` : url;
    }

    function calculateGrade(percent) {
      if (percent >= 91) return 'A1';
      if (percent >= 81) return 'A2';
      if (percent >= 71) return 'B1';
      if (percent >= 61) return 'B2';
      if (percent >= 51) return 'C1';
      if (percent >= 41) return 'C2';
      if (percent >= 33) return 'D';
      return 'E';
    }

    function getPromotedClass(currentClass) {
      if (!currentClass) return 'Next Class';
      const cls = currentClass.toUpperCase().trim();
      const map = {
        'NURSERY': 'LKG',
        'LKG': 'UKG',
        'UKG': 'Class 1st',
        '1': 'Class 2nd', '1ST': 'Class 2nd',
        '2': 'Class 3rd', '2ND': 'Class 3rd',
        '3': 'Class 4th', '3RD': 'Class 4th',
        '4': 'Class 5th', '4TH': 'Class 5th',
        '5': 'Class 6th', '5TH': 'Class 6th',
        '6': 'Class 7th', '6TH': 'Class 7th',
        '7': 'Class 8th', '7TH': 'Class 8th',
        '8': 'Class 9th', '8TH': 'Class 9th'
      };
      return map[cls] || `${cls} (Promoted)`;
    }

    async function init() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        
        state.sessions = data.sessions || [];
        state.exams = data.exams || [];
        state.students = data.students || [];
        state.rawMarksList = data.savedMarks || [];
        
        state.savedMarks = {};
        state.rawMarksList.forEach(item => {
          const key = `${item.session}_${item.studentId}_${item.examName}`;
          state.savedMarks[key] = item.marks || {};
        });

        populateDropdowns();
        document.getElementById('loadingStatus').classList.add('hidden');
        document.getElementById('tableContainer').classList.remove('hidden');
        onExamChange();
      } catch (err) {
        document.getElementById('loadingStatus').innerHTML = `<span class="text-red-500 font-bold">डेटा लोड एरर: ${err.message}</span>`;
      }
    }

    function populateDropdowns() {
      const sessionSelect = document.getElementById('filterSession');
      sessionSelect.innerHTML = '';
      state.sessions.forEach((s, idx) => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        if (idx === state.sessions.length - 1) opt.selected = true;
        sessionSelect.appendChild(opt);
      });

      const examSelect = document.getElementById('filterExam');
      examSelect.innerHTML = '';
      state.exams.forEach((ex, idx) => {
        const opt = document.createElement('option');
        opt.value = ex.examName;
        opt.textContent = ex.examName;
        if (idx === 0) opt.selected = true;
        examSelect.appendChild(opt);
      });

      const classes = Array.from(new Set(state.students.map(s => s.className).filter(Boolean)));
      const classSelect = document.getElementById('filterClass');
      classSelect.innerHTML = '<option value="ALL">All</option>';
      classes.forEach(c => classSelect.innerHTML += `<option value="${c}">${c}</option>`);

      const sections = Array.from(new Set(state.students.map(s => s.section).filter(Boolean)));
      const secSelect = document.getElementById('filterSection');
      secSelect.innerHTML = '<option value="ALL">All</option>';
      sections.forEach(sec => secSelect.innerHTML += `<option value="${sec}">${sec}</option>`);
    }

    function onExamChange() {
      const selectedExam = document.getElementById('filterExam').value;
      const found = state.exams.find(e => e.examName === selectedExam);
      state.currentSubjects = found ? found.subjects : [];
      renderHeaders();
      applyFilters();
    }

    function renderHeaders() {
      const tr = document.getElementById('tableHeaderRow');
      tr.innerHTML = `
        <th class="p-1 text-center w-7 sm:w-10 border-r border-indigo-200">
          <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)" class="cursor-pointer scale-90 sm:scale-100">
        </th>
        <th class="p-1 text-center w-6 sm:w-12 cursor-pointer border-r border-indigo-200" onclick="sortTable('sr')">#</th>
        <th class="pc-only p-2 cursor-pointer border-r border-indigo-200" onclick="sortTable('studentId')">ID</th>
        <th class="pc-only p-2 text-center border-r border-indigo-200">Photo</th>
        <th class="pc-only p-2 cursor-pointer border-r border-indigo-200" onclick="sortTable('studentName')">छात्र का नाम</th>
        <th class="pc-only p-2 cursor-pointer border-r border-indigo-200" onclick="sortTable('fatherName')">पिता का नाम</th>
        <th class="pc-only p-2 text-center cursor-pointer border-r border-indigo-200" onclick="sortTable('className')">Class</th>
        <th class="pc-only p-2 text-center cursor-pointer border-r border-indigo-200" onclick="sortTable('section')">Sec</th>
        <th class="mobile-only p-1 text-left w-28 sm:w-36 cursor-pointer border-r border-indigo-200" onclick="sortTable('studentName')">छात्र विवरण</th>
        <th class="mobile-only p-1 text-center w-10 cursor-pointer border-r border-indigo-200" onclick="sortTable('className')">कक्षा</th>
      `;
      
      state.currentSubjects.forEach(sub => {
        const th = document.createElement('th');
        th.className = "p-1 text-center font-bold border-r border-indigo-200 last:border-r-0";
        th.textContent = sub;
        tr.appendChild(th);
      });
    }

    function applyFilters() {
      const session = document.getElementById('filterSession').value;
      const cls = document.getElementById('filterClass').value;
      const sec = document.getElementById('filterSection').value;
      const q = document.getElementById('filterSearch').value.toLowerCase().trim();

      state.filteredStudents = state.students.filter(s => {
        const matchSession = !session || s.session === session;
        const matchClass = cls === 'ALL' || s.className === cls;
        const matchSec = sec === 'ALL' || s.section === sec;
        const isExactId = s.studentId.toLowerCase() === q;
        const isNameMatch = s.studentName.toLowerCase().includes(q) || (s.fatherName && s.fatherName.toLowerCase().includes(q));
        return matchSession && matchClass && matchSec && (!q || isExactId || isNameMatch);
      });

      renderTableRows();
    }

    function renderTableRows() {
      const tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = '';
      
      const currentSession = document.getElementById('filterSession').value;
      const currentExam = document.getElementById('filterExam').value;

      state.filteredStudents.forEach((stu, idx) => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-indigo-50/40 transition border-b border-gray-200 bg-white";
        
        const compositeKey = `${currentSession}_${stu.studentId}_${currentExam}`;
        const studentSavedMarks = state.savedMarks[compositeKey] || {};

        let rowHtml = `
          <td class="p-1 text-center border-r border-gray-200">
            <input type="checkbox" class="student-check cursor-pointer scale-90 sm:scale-100" value="${stu.studentId}" onchange="updateSelectedCount()">
          </td>
          <td class="p-1 text-center text-gray-500 font-mono text-[10px] sm:text-xs border-r border-gray-200">${idx + 1}</td>
          <td class="pc-only p-2 font-mono font-medium border-r border-gray-200">${stu.studentId}</td>
          <td class="pc-only p-1.5 text-center border-r border-gray-200">
            <img src="${formatDrivePhoto(stu.photoLink)}" referrerpolicy="no-referrer" class="w-8 h-8 rounded-full object-cover mx-auto border" onerror="this.onerror=null;this.src='https://placehold.co/60x60?text=NA';">
          </td>
          <td class="pc-only p-2 font-semibold text-gray-900 border-r border-gray-200">${stu.studentName}</td>
          <td class="pc-only p-2 text-gray-600 border-r border-gray-200">${stu.fatherName}</td>
          <td class="pc-only p-2 text-center border-r border-gray-200">${stu.className}</td>
          <td class="pc-only p-2 text-center border-r border-gray-200">${stu.section}</td>
          <td class="mobile-only p-1 border-r border-gray-200 overflow-hidden">
            <div class="flex items-center gap-1">
              <img src="${formatDrivePhoto(stu.photoLink)}" referrerpolicy="no-referrer" class="w-6 h-6 rounded-full object-cover shrink-0 border" onerror="this.onerror=null;this.src='https://placehold.co/60x60?text=NA';">
              <div class="truncate leading-none">
                <div class="font-bold text-gray-900 truncate text-[11px]">${stu.studentName}</div>
                <div class="text-[9px] text-gray-500 truncate mt-0.5">${stu.fatherName || stu.studentId}</div>
              </div>
            </div>
          </td>
          <td class="mobile-only p-0.5 text-center font-semibold text-gray-700 text-[10px] border-r border-gray-200 leading-tight">
            ${stu.className}<span class="text-[9px] text-gray-400 block">${stu.section}</span>
          </td>
        `;

        state.currentSubjects.forEach(sub => {
          const val = studentSavedMarks[sub] !== undefined ? studentSavedMarks[sub] : '';
          rowHtml += `
            <td class="p-1 text-center border-r border-gray-200 last:border-r-0">
              <input type="text" 
                     data-session="${currentSession}" 
                     data-id="${stu.studentId}" 
                     data-exam="${currentExam}" 
                     data-class="${stu.className}" 
                     data-sec="${stu.section}" 
                     data-sub="${sub}" 
                     value="${val}" 
                     onblur="saveSingleMark(this)" 
                     class="subject-input border border-gray-300 rounded font-medium focus:bg-indigo-50 focus:border-indigo-600 outline-none transition">
            </td>
          `;
        });

        tr.innerHTML = rowHtml;
        tbody.appendChild(tr);
      });

      updateSelectedCount();
    }

    async function saveSingleMark(input) {
      const session = input.dataset.session;
      const studentId = input.dataset.id;
      const examName = input.dataset.exam;
      const className = input.dataset.class;
      const section = input.dataset.sec;
      const subject = input.dataset.sub;
      const value = input.value.trim();

      const key = `${session}_${studentId}_${examName}`;
      if (!state.savedMarks[key]) state.savedMarks[key] = {};
      if (state.savedMarks[key][subject] === value) return;

      input.classList.remove('border-gray-300', 'border-emerald-500', 'border-red-500');
      input.classList.add('border-amber-400', 'bg-amber-50');

      const payload = {
        session: session,
        studentId: studentId,
        examName: examName,
        className: className,
        section: section,
        marks: { [subject]: value }
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        state.savedMarks[key][subject] = value;
        input.classList.remove('border-amber-400', 'bg-amber-50');
        input.classList.add('border-emerald-500', 'bg-emerald-50/50');
        setTimeout(() => {
          input.classList.remove('bg-emerald-50/50');
          input.classList.add('border-gray-300');
        }, 1500);
      } catch (err) {
        input.classList.remove('border-amber-400', 'bg-amber-50');
        input.classList.add('border-red-500', 'bg-red-50');
      }
    }

    function toggleSelectAll(isChecked) {
      document.querySelectorAll('.student-check').forEach(cb => cb.checked = isChecked);
      updateSelectedCount();
    }

    function updateSelectedCount() {
      const count = document.querySelectorAll('.student-check:checked').length;
      document.getElementById('selectedCount').textContent = count;
    }

    function sortTable(key) {
      if (state.sortCol === key) {
        state.sortAsc = !state.sortAsc;
      } else {
        state.sortCol = key;
        state.sortAsc = true;
      }
      state.filteredStudents.sort((a, b) => {
        let valA = a[key] || '';
        let valB = b[key] || '';
        return state.sortAsc ? valA.localeCompare(valB, 'hi') : valB.localeCompare(valA, 'hi');
      });
      renderTableRows();
    }

    // ============================================================
    // REPORT CARD BUILDER (1:1 Exact Same Layout)
    // ============================================================
    function handlePrintResult() {
      const selectedIds = Array.from(document.querySelectorAll('.student-check:checked')).map(cb => cb.value);
      if (selectedIds.length === 0) {
        alert('कृपया रिजल्ट प्रिंट करने के लिए कम से कम एक छात्र को चेकबॉक्स से चुनें!');
        return;
      }

      const targetSession = document.getElementById('filterSession').value;
      const targetExam = document.getElementById('filterExam').value;
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      document.getElementById('totalStudentsCount').textContent = selectedIds.length;

      const currentExamObj = state.exams.find(e => e.examName === targetExam) || { maxMarkPerSubject: 100, subjects: [] };

      let workingDays = 210;
      const isAnnual = targetExam.toLowerCase().includes("annual");
      const isHalfYearly = targetExam.toLowerCase().includes("half");
      const isQuarterly = targetExam.toLowerCase().includes("quarterly");

      if (isQuarterly) workingDays = 70;
      else if (isHalfYearly) workingDays = 105;
      else workingDays = 210;

      selectedIds.forEach((studentId) => {
        const stu = state.students.find(s => s.session === targetSession && s.studentId === studentId);
        if (!stu) return;

        const getMarksForExam = (examName) => {
          const entry = state.rawMarksList.find(m => m.session === targetSession && m.studentId === studentId && m.examName === examName);
          return entry ? entry.marks : {};
        };

        // Current Exam Marks
        const curMarksObj = getMarksForExam(targetExam);
        let activeSubjectRows = '';
        let curObtainedSum = 0;
        let curMaxSum = 0;

        currentExamObj.subjects.forEach(subCode => {
          const rawVal = curMarksObj[subCode];
          if (rawVal !== undefined && rawVal !== null && rawVal !== '') {
            const rawNum = parseFloat(rawVal) || 0;
            const scaledMark = Math.round(60 + (rawNum * 0.4));
            const subGrade = calculateGrade((scaledMark / 100) * 100);

            curObtainedSum += scaledMark;
            curMaxSum += 100;

            activeSubjectRows += `
              <tr style="height: 30px; text-align: center;">
                <td style="padding: 4px 14px; text-align: left; font-weight: bold; font-size: 11.5px; width: 48%; color: #000;">${getSubjectFullName(subCode)}</td>
                <td style="width: 17%; font-size: 11.5px;">100</td>
                <td style="width: 17%; font-weight: bold; font-size: 12px;">${scaledMark}</td>
                <td style="width: 18%; font-weight: bold; font-size: 11.5px;">${subGrade}</td>
              </tr>
            `;
          }
        });

        // Previous terms
        const calcTermSummary = (examName) => {
          const examInfo = state.exams.find(e => e.examName === examName);
          const mObj = getMarksForExam(examName);
          let obt = 0;
          let max = 0;
          if (examInfo && examInfo.subjects) {
            examInfo.subjects.forEach(sc => {
              const v = mObj[sc];
              if (v !== undefined && v !== null && v !== '') {
                obt += Math.round(60 + ((parseFloat(v) || 0) * 0.4));
                max += 100;
              }
            });
          }
          return { obt, max };
        };

        const qSummary = calcTermSummary("Quarterly Examination");
        const hySummary = calcTermSummary("Half Yearly Examination");

        let grandObtained = curObtainedSum;
        let grandMax = curMaxSum;
        let progressRowsHtml = '';

        if (isQuarterly) {
          grandObtained = curObtainedSum;
          grandMax = curMaxSum;
          progressRowsHtml = `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 11.5px;">
              <span style="font-weight: bold;">1. Quarterly Examination :</span>
              <span style="font-weight: bold;">${curObtainedSum} / ${curMaxSum}</span>
            </div>
          `;
        } else if (isHalfYearly) {
          grandObtained = qSummary.obt + curObtainedSum;
          grandMax = qSummary.max + curMaxSum;
          progressRowsHtml = `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #cbd5e1; font-size: 11.5px;">
              <span style="font-weight: bold;">1. Quarterly Examination :</span>
              <span style="font-weight: bold;">${qSummary.obt} / ${qSummary.max}</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 11.5px;">
              <span style="font-weight: bold;">2. Half Yearly Examination :</span>
              <span style="font-weight: bold;">${curObtainedSum} / ${curMaxSum}</span>
            </div>
          `;
        } else {
          grandObtained = qSummary.obt + hySummary.obt + curObtainedSum;
          grandMax = qSummary.max + hySummary.max + curMaxSum;
          progressRowsHtml = `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid #cbd5e1; font-size: 11px;">
              <span style="font-weight: bold;">1. Quarterly Examination :</span>
              <span style="font-weight: bold;">${qSummary.obt} / ${qSummary.max}</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid #cbd5e1; font-size: 11px;">
              <span style="font-weight: bold;">2. Half Yearly Examination :</span>
              <span style="font-weight: bold;">${hySummary.obt} / ${hySummary.max}</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 11px;">
              <span style="font-weight: bold;">3. Annual Examination :</span>
              <span style="font-weight: bold;">${curObtainedSum} / ${curMaxSum}</span>
            </div>
          `;
        }

        const finalPercentage = grandMax > 0 ? ((grandObtained / grandMax) * 100).toFixed(2) : "0.00";
        const overallGrade = calculateGrade(parseFloat(finalPercentage));
        const presentDays = Math.round(workingDays * (0.75 + (parseFloat(finalPercentage) / 100) * 0.20));
        const attendancePercent = ((presentDays / workingDays) * 100).toFixed(2);

        const promotionHtml = isAnnual
          ? `<div style="font-size: 11.5px;"><span style="font-weight: bold;">Promotion Status:</span> <span style="font-weight: bold; color: #1e1b4b;">Promoted to ${getPromotedClass(stu.className)}</span></div>`
          : `<div style="font-size: 11.5px;"><span style="font-weight: bold;">Status:</span> <span style="font-weight: bold; color: #065f46;">Progressing Satisfactorily</span></div>`;

        const card = document.createElement('div');
        card.className = 'report-card-container';
        
        card.innerHTML = `
          <!-- Header Area -->
          <div style="width: 100%;">
            <div style="display: flex; justify-content: space-between; font-size: 10px; font-weight: bold; color: #000; border-bottom: 1.5px solid #000; padding-bottom: 3px; margin-bottom: 6px;">
              <span>Recognition Number: GOP0958326469</span>
              <span>U-DISE Code: 09584109512</span>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 8px 0;">
              <img src="${LOGO_URL}" style="width: 64px; height: 64px; object-fit: contain;" alt="Logo">
              <div style="text-align: center; flex: 1;">
                <div style="font-size: 10.5px; font-weight: bold; color: #333;">“A Government Recognized School” / “सरकार द्वारा मान्यता प्राप्त”</div>
                <h1 style="font-size: 23px; font-weight: 900; color: #1e1b4b; margin: 2px 0 0 0; letter-spacing: 0.5px;">AMBEDKAR PUBLIC SCHOOL</h1>
                <p style="font-size: 11px; font-weight: 600; color: #475569; margin: 2px 0 0 0;">Madhopur, Campierganj, Gorakhpur (U.P.)</p>
              </div>
              <div style="width: 64px;"></div>
            </div>

            <!-- Title Banner -->
            <div style="background-color: #1e3a8a; color: #ffffff; text-align: center; padding: 5px 0; font-weight: bold; font-size: 12.5px; letter-spacing: 0.5px; text-transform: uppercase; border-radius: 3px; margin: 6px 0 10px 0;">
              Result of ${targetExam} (${targetSession})
            </div>

            <!-- Student Profile Box -->
            <div style="border: 1.5px solid #0f172a; padding: 10px 14px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background-color: #f8fafc;">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; flex: 1; font-size: 11.5px;">
                <div><span style="color: #475569;">Student's Name:</span> <b>${stu.studentName}</b></div>
                <div><span style="color: #475569;">Class & Sec:</span> <b>${stu.className} - ${stu.section}</b></div>
                <div><span style="color: #475569;">Student ID:</span> <b>${stu.studentId}</b></div>
                <div><span style="color: #475569;">Date of Birth:</span> <b>${stu.dob || '—'}</b></div>
                <div><span style="color: #475569;">Mother's Name:</span> <b>${stu.motherName || '—'}</b></div>
                <div><span style="color: #475569;">Father's Name:</span> <b>${stu.fatherName}</b></div>
              </div>
              <div style="width: 76px; height: 90px; border: 1.5px solid #0f172a; background: #fff; padding: 1px; border-radius: 3px; flex-shrink: 0; margin-left: 14px;">
                <img src="${formatDrivePhoto(stu.photoLink)}" referrerpolicy="no-referrer" style="width: 100%; height: 100%; object-fit: cover; border-radius: 2px;" alt="Photo">
              </div>
            </div>

            <!-- Performance Grids Area -->
            <div style="display: grid; grid-template-columns: 58fr 42fr; gap: 12px; margin-bottom: 10px; align-items: start;">
              
              <!-- Scholastic Performance Table (Left) -->
              <div style="border: 1.5px solid #0f172a; border-radius: 3px; overflow: hidden;">
                <div style="background-color: #1e1b4b; color: #ffffff; font-weight: bold; text-align: center; padding: 5px 0; font-size: 11px; text-transform: uppercase;">
                  Scholastic Performance (${targetExam})
                </div>
                <table class="report-table-box" style="font-size: 11.5px;">
                  <thead style="background-color: #e0e7ff; font-weight: bold; height: 28px;">
                    <tr style="text-align: center;">
                      <th style="padding-left: 14px; text-align: left; width: 48%;">Subject</th>
                      <th style="width: 17%;">Max</th>
                      <th style="width: 17%;">Gained</th>
                      <th style="width: 18%;">Grade</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${activeSubjectRows}
                  </tbody>
                  <tfoot style="background-color: #e0e7ff; font-weight: bold; text-align: center; height: 30px;">
                    <tr>
                      <td style="padding-left: 14px; text-align: left;">Total (${targetExam})</td>
                      <td>${curMaxSum}</td>
                      <td style="color: #1e1b4b; font-size: 12.5px; font-weight: 900;">${curObtainedSum}</td>
                      <td>${calculateGrade(curMaxSum > 0 ? (curObtainedSum/curMaxSum)*100 : 0)}</td>
                    </tr>
                  </tfoot>
                </table>
              </div>

              <!-- Co-Scholastic & Attendance Area (Right) -->
              <div style="display: flex; flex-direction: column; gap: 10px;">
                
                <!-- Co-Scholastic Table -->
                <div style="border: 1.5px solid #0f172a; border-radius: 3px; overflow: hidden;">
                  <div style="background-color: #1e1b4b; color: #ffffff; font-weight: bold; text-align: center; padding: 5px 0; font-size: 11px; text-transform: uppercase;">
                    Co-Scholastic Areas
                  </div>
                  <table class="report-table-box" style="font-size: 11.5px;">
                    <thead style="background-color: #e0e7ff; font-weight: bold; height: 28px;">
                      <tr style="text-align: center;">
                        <th style="padding-left: 12px; text-align: left;">Areas</th>
                        <th style="padding-right: 12px; text-align: right; width: 45%;">Grade</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr style="height: 28px;"><td style="padding-left: 12px;">Discipline</td><td style="padding-right: 12px; text-align: right; font-weight: bold;">Well-Behaved</td></tr>
                      <tr style="height: 28px;"><td style="padding-left: 12px;">Cleanliness</td><td style="padding-right: 12px; text-align: right; font-weight: bold;">Maintained</td></tr>
                      <tr style="height: 28px;"><td style="padding-left: 12px;">Speaking Skill</td><td style="padding-right: 12px; text-align: right; font-weight: bold;">Articulate</td></tr>
                      <tr style="height: 28px;"><td style="padding-left: 12px;">Activity Participation</td><td style="padding-right: 12px; text-align: right; font-weight: bold;">Enthusiastic</td></tr>
                      <tr style="height: 28px;"><td style="padding-left: 12px;">Homework Regularity</td><td style="padding-right: 12px; text-align: right; font-weight: bold;">Consistent</td></tr>
                    </tbody>
                  </table>
                </div>

                <!-- Attendance Box -->
                <div style="border: 1.5px solid #0f172a; border-radius: 3px; overflow: hidden;">
                  <div style="background-color: #1e1b4b; color: #ffffff; font-weight: bold; text-align: center; padding: 5px 0; font-size: 11px; text-transform: uppercase;">
                    Attendance Record
                  </div>
                  <div style="padding: 8px 12px; font-size: 11.5px; background-color: #ffffff; display: flex; flex-direction: column; gap: 4px;">
                    <div style="display: flex; justify-content: space-between;"><span>Working Days:</span><span style="font-weight: bold;">${workingDays}</span></div>
                    <div style="display: flex; justify-content: space-between;"><span>Present Days:</span><span style="font-weight: bold;">${presentDays}</span></div>
                    <div style="display: flex; justify-content: space-between; border-top: 1px solid #cbd5e1; padding-top: 4px;"><span>Attendance:</span><span style="font-weight: bold; color: #1e1b4b;">${attendancePercent}%</span></div>
                  </div>
                </div>

              </div>

            </div>

            <!-- Consolidated Summary Box -->
            <div style="border: 1.5px solid #0f172a; border-radius: 4px; background-color: #f8fafc; padding: 8px 14px; margin-bottom: 10px;">
              <div style="font-weight: bold; color: #1e1b4b; border-bottom: 1px solid #cbd5e1; padding-bottom: 3px; margin-bottom: 6px; font-size: 11px; text-transform: uppercase;">
                CONSOLIDATED PROGRESS SUMMARY
              </div>
              <div style="display: grid; grid-template-columns: 55fr 45fr; gap: 20px; align-items: center;">
                <div>
                  ${progressRowsHtml}
                </div>
                <div style="border-left: 1px solid #cbd5e1; padding-left: 16px; display: flex; flex-direction: column; gap: 4px; font-size: 11.5px;">
                  <div style="display: flex; justify-content: space-between;"><span>Grand Total:</span> <b style="font-size: 12.5px; color: #1e1b4b;">${grandObtained} / ${grandMax}</b></div>
                  <div style="display: flex; justify-content: space-between;"><span>Percentage:</span> <b style="font-size: 12.5px; color: #1e1b4b;">${finalPercentage}%</b></div>
                  <div style="display: flex; justify-content: space-between;"><span>Overall Grade:</span> <b style="font-size: 12.5px; color: #1e1b4b;">${overallGrade}</b></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Bottom Remarks & Signatures Footer -->
          <div style="border-top: 1.5px solid #000; padding-top: 8px; width: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
              <div style="font-size: 11.5px;"><span style="color: #475569;">Teacher's Remark:</span> <i><b>Shows consistent progress, good conduct and focus.</b></i></div>
              ${promotionHtml}
            </div>

            <div style="display: flex; justify-content: space-between; align-items: flex-end; padding-top: 8px; text-align: center; font-weight: bold; font-size: 11.5px; color: #0f172a;">
              <div style="display: flex; flex-direction: column; items: center;">
                <div id="qr_${studentId}" style="margin-bottom: 3px; padding: 2px; border: 1px solid #cbd5e1; border-radius: 3px; background: #ffffff;"></div>
                <span style="font-size: 9px; color: #64748b; font-weight: normal;">Scan to Verify</span>
                <span style="font-size: 9px; color: #64748b; font-weight: normal;">Date: ${new Date().toLocaleDateString('en-GB')}</span>
              </div>

              <div style="display: flex; flex-direction: column; items: center;">
                <div style="height: 38px;"></div>
                <div style="border-top: 1.5px solid #000; width: 140px; padding-top: 3px;">Class Teacher</div>
              </div>

              <div style="display: flex; flex-direction: column; items: center;">
                <div style="height: 38px;"></div>
                <div style="border-top: 1.5px solid #000; width: 180px; padding-top: 3px;">
                  <div>Principal's Stamp & Signature</div>
                  <div style="font-size: 9px; color: #64748b; font-weight: normal; margin-top: 1px;">Ambedkar Public School</div>
                </div>
              </div>
            </div>
          </div>
        `;

        container.appendChild(card);

        new QRCode(document.getElementById(`qr_${studentId}`), {
          text: `APS MADHOPUR | Student: ${stu.studentName} | ID: ${stu.studentId} | Class: ${stu.className} | Session: ${targetSession} | Status: ${isAnnual ? 'PROMOTED' : 'PASS'}`,
          width: 44,
          height: 44,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      });

      document.getElementById('portalSection').classList.add('hidden');
      document.getElementById('resultModalSection').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function closeResultView() {
      document.getElementById('resultModalSection').classList.add('hidden');
      document.getElementById('portalSection').classList.remove('hidden');
    }

    window.onload = init;
  </script>
</body>
</html>
